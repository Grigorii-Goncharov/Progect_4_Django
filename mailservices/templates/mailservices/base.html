<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Рассылка{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fb; }
        .navbar { background-color: #28a745; }
        .main-content { min-height: 86vh; }
        footer { background-color: #28a745; color: #ccc; padding: 2rem 0; }
    </style>
</head>
<body>

{% block header %}
{%  include 'mailservices/includes/inc_menu.html' %}
{% endblock %}

<!-- Контент -->
<main class="main-content py-5">
    <div class="container">
        {% block content %}
        <p>Содержимое страницы</p>
        {% endblock %}
    </div>
</main>

<!-- Подвал -->
<footer class="text-center text-lg-start">
    <div class="container">
        <div class="row">
            <div class="col-md-6 text-center text-md-start">
                <small>&copy; 2025 <strong>Сервис почтовых рассылок</strong>. Управление рассылками</small>
            </div>
            <div class="col-md-6 text-center text-md-end mt-2 mt-md-0">
                <a href="#" class="text-muted me-3"></a>
                <a href="#" class="text-muted"></a>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
